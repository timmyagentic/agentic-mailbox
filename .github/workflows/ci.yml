name: CI
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version tag
        id: tag
        shell: bash
        run: |
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            git merge-base --is-ancestor HEAD origin/main
            echo 'release=true' >> "$GITHUB_OUTPUT"
            version_without_metadata="${GITHUB_REF_NAME%%+*}"
            if [[ "$version_without_metadata" == *-* ]]; then
              echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            else
              echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build-mac:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Apple Silicon Mac ZIP
        run: |
          npm run build
          npx --no-install wrangler deploy --dry-run --outdir .wrangler/local-worker
          node scripts/package-mac.mjs
      - name: Verify the extracted installer
        run: |
          bash scripts/check-mac-package.sh outputs/agentic-mailbox-mac-arm64.zip
          cd outputs
          shasum -a 256 agentic-mailbox-mac-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            outputs/agentic-mailbox-mac-arm64.zip
            outputs/SHA256SUMS

  publish:
    needs: [verify, build-mac]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: mac-arm64
          path: release-assets
      - name: Publish and verify the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"

          cd release-assets
          sha256sum --check SHA256SUMS
          assets=(agentic-mailbox-mac-arm64.zip SHA256SUMS)
          if release=$(gh release view "$tag" --json isDraft,author); then
            if [[ "$(jq -r .isDraft <<< "$release")" == true ]]; then
              if [[ "$(jq -r .author.login <<< "$release")" != 'github-actions[bot]' ]]; then
                echo "A manually created draft already exists for $tag." >&2
                exit 1
              fi
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --prerelease="$PRERELEASE"
            fi
          else
            gh release create "$tag" "${assets[@]}" --verify-tag \
              --title "Agentic Mailbox $tag" --generate-notes --prerelease="$PRERELEASE"
          fi

          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|join(",")')" = "false,$PRERELEASE"
          mkdir verified-downloads
          gh release download "$tag" --dir verified-downloads \
            --pattern agentic-mailbox-mac-arm64.zip --pattern SHA256SUMS
          cd verified-downloads
          sha256sum --check SHA256SUMS
