name: CI
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.tag.outputs.release }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version tag
        id: tag
        shell: bash
        run: |
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            git merge-base --is-ancestor HEAD origin/main
            echo 'release=true' >> "$GITHUB_OUTPUT"
            version_without_metadata="${GITHUB_REF_NAME%%+*}"
            if [[ "$version_without_metadata" == *-* ]]; then
              echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            else
              echo 'prerelease=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  publish:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "OpenPostway $tag" --generate-notes --prerelease="$PRERELEASE"
          fi
          test "$(gh release view "$tag" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|join(",")')" = "false,$PRERELEASE"
