name: CI
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
